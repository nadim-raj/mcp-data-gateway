[project]
name = "mcp-data-gateway"
version = "0.1.0"
description = "A governed MCP server: organisations connect a database, authenticate through their own identity provider, and query it under role-based limits with a full audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kazi Nadimul Haque" }]
keywords = ["mcp", "model-context-protocol", "oauth", "rbac", "sql", "audit", "data-governance"]

dependencies = [
  "mcp>=1.23",
  "sqlglot>=27",
  "pydantic>=2.9",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_data_gateway"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
